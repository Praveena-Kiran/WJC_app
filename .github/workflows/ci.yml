name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Typecheck & Tests (#065)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./mobile

      - name: Typecheck
        run: npm run typecheck
        working-directory: ./mobile

      - name: Unit Tests
        run: npm run test
        working-directory: ./mobile

  docker-smoke:
    name: Docker Build Smoke Test (#066)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t zengo-app:smoke .
